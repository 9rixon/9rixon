-serif" font-size="18">실제 대리점 시상 기준·13회차 유지 조건·상품별 추가시상과 무관한</text><text x="100" y="980" fill="#645a45" font-family="Arial,sans-serif" font-size="18">화면 시연용 예시입니다. 운영 규칙으로 사용하지 마세요.</text></svg>

r="middle" class="red bold small">290만원</text><rect x="54" y="1190" width="792" height="112" rx="8" fill="#fff2d8"/><text x="76" y="1225" class="small bold">지급 및 유지 조건</text><text x="76" y="1260" class="small">12회차 유지 확인 후 익월 지급 · 기준·지급 시점은 가상 예시이며 실제 약관/시상 기준이 아닙니다.</text><text x="76" y="1288" class="small">해당 구간만 지급합니다. 연속가동은 다음 기간 조건 충족 시 직전 구간 상금만 지급하며 누적하지 않습니다.</text><text x="54" y="1325" class="tiny">※ 시연용 가상 자료 · 실제 회사, 대리점, 설계사, 상품, 시상과 무관</text><style>.brand{font:800 27px Arial,sans-serif;fill:#fff}.head{font:800 31px Arial,sans-serif;fill:#fff}.section{font:700 23px Arial,sans-serif;fill:#fff}.gold{fill:#ffe344}.white{fill:#fff}.txt{font:700 22px Arial,sans-serif;fill:#2b2525}.small{font:17px Arial,sans-serif;fill:#332d2d}.tiny{font:13px Arial,sans-serif;fill:#837d7c}.bold{font-weight:700}.red{fill:#b21b24}.rate{font:700 30px Arial,sans-serif}</style></svg>